<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controlador DJ Pop Art Compacto</title>

  <style>
    :root {
      --cream: #fff3d9;
      --cream-2: #ffe9bd;
      --ink: #070b0f;
      --red: #ff5247;
      --blue: #078fe3;
      --yellow: #ffd333;
      --pink: #ffd6d8;
      --white: #fffaf0;
      --muted: #5d5145;
      --line: 4px solid var(--ink);
      --shadow-hard: 6px 6px 0 var(--ink);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "Arial Black", Impact, Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 8% 88%, rgba(255, 82, 71, 0.38) 0 3px, transparent 4px) 0 0 / 22px 22px,
        radial-gradient(circle at 88% 54%, rgba(255, 211, 51, 0.55) 0 3px, transparent 4px) 0 0 / 24px 24px,
        repeating-radial-gradient(circle at 76% 10%, transparent 0 36px, rgba(255, 82, 71, 0.22) 37px 38px, transparent 39px 68px),
        linear-gradient(145deg, var(--white), var(--cream));
      padding-bottom: 14px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.42;
      background:
        repeating-linear-gradient(112deg, transparent 0 34px, rgba(255, 82, 71, 0.22) 35px 36px, transparent 37px 70px),
        repeating-linear-gradient(0deg, transparent 0 11px, rgba(7, 11, 15, 0.035) 12px 13px);
      mix-blend-mode: multiply;
    }

    .app {
      width: min(1040px, calc(100vw - 22px));
      margin: 0 auto;
      padding-top: 10px;
    }

    .dj-panel {
      position: relative;
      display: grid;
      grid-template-columns: 142px minmax(0, 1fr);
      overflow: hidden;
      background: var(--cream);
      border: 5px solid var(--ink);
      border-radius: 18px;
      box-shadow: 0 9px 0 var(--ink), 0 24px 44px rgba(7, 11, 15, 0.22);
    }

    .dj-panel::after {
      content: "";
      position: absolute;
      inset: 10px;
      z-index: 5;
      border: 2px solid var(--ink);
      border-radius: 12px;
      pointer-events: none;
    }

    .side-rail {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: 108px 210px 54px 1fr;
      min-height: 620px;
      background: var(--cream);
      border-right: var(--line);
    }

    .dot-matrix {
      position: relative;
      background: var(--ink);
      border-bottom: var(--line);
    }

    .dot-matrix::before {
      content: "";
      position: absolute;
      inset: 20px 24px;
      background: radial-gradient(circle, var(--red) 0 3px, transparent 4px) 0 0 / 18px 18px;
    }

    .knob-block {
      position: relative;
      display: grid;
      align-content: start;
      justify-items: center;
      gap: 12px;
      padding: 22px 14px 14px;
      border-bottom: var(--line);
      background: linear-gradient(180deg, var(--white), var(--cream));
    }

    .knob-block::before {
      content: "";
      width: 66px;
      height: 66px;
      display: block;
      border: var(--line);
      border-radius: 50%;
      background:
        linear-gradient(120deg, transparent 0 52%, var(--red) 53% 62%, transparent 63%),
        radial-gradient(circle at 50% 50%, var(--ink) 0 53%, var(--white) 54% 59%, transparent 60%),
        repeating-conic-gradient(from -38deg, var(--ink) 0deg 3deg, transparent 3deg 18deg);
      box-shadow: 0 0 0 6px var(--cream), 0 0 0 9px var(--ink);
    }

    .fake-fader {
      width: 100%;
      min-height: 96px;
      display: grid;
      grid-template-columns: 1fr 24px 1fr;
      align-items: center;
      gap: 10px;
    }

    .fake-fader::before {
      content: "";
      justify-self: end;
      width: 18px;
      height: 94px;
      border-radius: 999px;
      background: var(--ink);
    }

    .fake-fader::after {
      content: "";
      width: 36px;
      height: 28px;
      margin-left: -20px;
      border: 4px solid var(--ink);
      border-radius: 5px;
      background: var(--red);
    }

    .side-label {
      align-self: end;
      grid-column: 1 / -1;
      margin-top: -4px;
      font-size: 0.64rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .side-stripes {
      border-bottom: var(--line);
      background: repeating-linear-gradient(0deg, var(--ink) 0 4px, transparent 4px 10px), var(--cream);
    }

    .wave-block {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, var(--blue) 0 58px, var(--cream) 58px), var(--cream);
    }

    .wave-block::before {
      content: "";
      position: absolute;
      left: 22px;
      top: 34px;
      width: 92px;
      height: 20px;
      border-top: 6px solid var(--yellow);
      border-radius: 50%;
      filter: drop-shadow(22px 0 0 var(--yellow)) drop-shadow(-22px 0 0 var(--yellow));
    }

    .wave-block::after {
      content: "";
      position: absolute;
      left: 38px;
      right: 28px;
      bottom: 58px;
      height: 116px;
      border-left: 4px solid var(--ink);
      border-bottom: 4px solid var(--ink);
      border-radius: 0 0 0 55px;
      transform: skewY(-20deg) rotate(-3deg);
    }

    .deck-grid {
      position: relative;
      z-index: 1;
      padding: 14px;
      background:
        radial-gradient(circle at 100% 2%, var(--ink) 0 60px, transparent 62px),
        radial-gradient(circle at 100% 2%, transparent 0 72px, var(--ink) 73px 76px, transparent 77px 88px, var(--ink) 89px 92px, transparent 93px),
        linear-gradient(135deg, transparent 0 86%, var(--blue) 86% 95%, var(--ink) 95% 96%, var(--cream) 96%),
        var(--cream);
    }

    .header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin: 0 0 10px;
      padding: 0 8px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.75rem, 3.8vw, 3.25rem);
      line-height: 0.9;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 4px 4px 0 var(--yellow);
    }

    .header p {
      max-width: 240px;
      margin: 0 0 5px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.66rem;
      font-weight: 900;
      line-height: 1.22;
      text-align: right;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .top-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      align-items: stretch;
      margin-bottom: 10px;
    }

    .effects-group {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      min-height: 88px;
      padding: 10px;
      border: var(--line);
      border-radius: 12px;
      background:
        radial-gradient(circle, var(--red) 0 3px, transparent 4px) 16px 14px / 20px 20px,
        var(--cream-2);
      box-shadow: inset -6px -6px 0 rgba(7, 11, 15, 0.06);
    }

    .group-title {
      justify-self: start;
      padding: 5px 12px 4px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: var(--white);
      font-size: 0.68rem;
      line-height: 1;
      letter-spacing: 1.1px;
      text-transform: uppercase;
    }

    .fx-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .music-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      font-family: inherit;
    }

    .pad {
      --accent: var(--red);
      position: relative;
      width: 100%;
      min-height: 96px;
      padding: 12px 10px 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--ink);
      border: var(--line);
      border-radius: 12px;
      background: var(--accent);
      box-shadow: inset -8px -8px 0 rgba(7, 11, 15, 0.08);
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      user-select: none;
      transition: transform 0.13s ease, box-shadow 0.13s ease, filter 0.13s ease;
    }

    .pad::before,
    .pad::after {
      content: "+";
      position: absolute;
      top: 8px;
      z-index: 2;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--ink);
      color: var(--accent);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 900;
      line-height: 1;
    }

    .pad::before {
      left: 8px;
    }

    .pad::after {
      right: 8px;
    }

    .pad:hover {
      transform: translate(-3px, -3px);
      box-shadow: var(--shadow-hard), inset -8px -8px 0 rgba(7, 11, 15, 0.08);
      filter: saturate(1.08);
    }

    .pad:active {
      transform: translate(3px, 3px);
      box-shadow: inset -6px -6px 0 rgba(7, 11, 15, 0.08);
    }

    .pad:focus-visible,
    .play-btn:focus-visible,
    input[type="range"]:focus-visible {
      outline: 4px solid var(--blue);
      outline-offset: 4px;
    }

    .pad .label {
      position: relative;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 64%;
      min-height: 28px;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--ink);
      color: var(--white);
      box-shadow: 0 4px 0 rgba(7, 11, 15, 0.3);
      font-size: clamp(0.7rem, 1vw, 0.86rem);
      font-weight: 950;
      line-height: 1;
      letter-spacing: 0.6px;
    }

    .pad .sub {
      position: relative;
      z-index: 3;
      color: rgba(7, 11, 15, 0.78);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.64rem;
      font-weight: 900;
      letter-spacing: 0.9px;
    }

    .jingle-track {
      --accent: var(--red);
      grid-column: 2 / span 2;
      background:
        radial-gradient(circle at 88% 18%, var(--yellow) 0 3px, transparent 4px) 0 0 / 22px 22px,
        var(--red);
    }

    .music-btn.jingle-track .icon {
      position: relative;
      z-index: 2;
      width: 64px;
      height: 50px;
      display: block;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      filter: drop-shadow(4px 4px 0 rgba(7, 11, 15, 0.2));
    }

    .music-btn.jingle-track .icon::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 9px;
      width: 42px;
      height: 31px;
      border: 4px solid var(--ink);
      background: var(--white);
      clip-path: polygon(0 22%, 100% 0, 100% 100%, 0 78%);
    }

    .music-btn.jingle-track .icon::after {
      content: "";
      position: absolute;
      inset: auto;
      left: 0;
      top: 16px;
      width: 20px;
      height: 20px;
      border: 4px solid var(--ink);
      border-radius: 4px;
      background: var(--white);
      box-shadow: 7px 25px 0 -3px var(--ink), 10px 25px 0 -4px var(--red);
    }

    .music-btn.jingle-track .icon span {
      position: absolute;
      right: -12px;
      top: 5px;
      width: 26px;
      height: 40px;
      border-right: 4px solid var(--ink);
      border-top: 4px solid transparent;
      transform: rotate(-15deg);
    }

    .music-btn.jingle-track .icon span::before,
    .music-btn.jingle-track .icon span::after {
      content: "";
      position: absolute;
      right: -20px;
      width: 18px;
      height: 4px;
      background: var(--ink);
      border-radius: 999px;
    }

    .music-btn.jingle-track .icon span::before {
      top: 6px;
      transform: rotate(-25deg);
    }

    .music-btn.jingle-track .icon span::after {
      bottom: 11px;
      transform: rotate(25deg);
    }

    .fx-btn {
      min-height: 58px;
      padding: 10px 8px 8px;
    }

    .fx-btn[data-fx="fx1"] {
      --accent: var(--blue);
      --burst: var(--yellow);
    }

    .fx-btn[data-fx="fx2"] {
      --accent: var(--yellow);
      --burst: var(--blue);
    }

    .fx-btn[data-fx="fx3"] {
      --accent: var(--red);
      --burst: var(--cream-2);
    }

    .fx-btn[data-fx="sk1"] {
      --accent: var(--blue);
      --burst: var(--yellow);
    }

    .fx-btn .icon {
      position: absolute;
      z-index: 1;
      width: min(72px, 70%);
      height: 42px;
      background: var(--burst);
      clip-path: polygon(50% 0%, 61% 21%, 82% 9%, 79% 34%, 100% 40%, 80% 54%, 92% 76%, 66% 72%, 58% 100%, 43% 76%, 17% 92%, 22% 62%, 0 54%, 22% 40%, 10% 17%, 37% 26%);
      filter: drop-shadow(4px 4px 0 var(--ink));
    }

    .fx-btn .label {
      min-width: 0;
      padding: 0;
      background: transparent;
      color: var(--ink);
      box-shadow: none;
      font-size: clamp(0.95rem, 1.7vw, 1.28rem);
      letter-spacing: 1px;
    }

    .fx-btn .sub,
    .music-btn .sub {
      display: none;
    }

    .fx-btn::before,
    .fx-btn::after {
      color: var(--accent);
    }

    .music-btn {
      min-height: 98px;
      padding: 10px 10px 9px;
      border-radius: 12px;
      gap: 7px;
    }

    .music-btn:nth-child(1) {
      --accent: var(--red);
      grid-column: span 2;
    }

    .music-btn:nth-child(2) {
      --accent: var(--pink);
      grid-column: span 2;
    }

    .music-btn:nth-child(3) {
      --accent: var(--blue);
      grid-column: span 2;
    }

    .music-btn:nth-child(4) {
      --accent: var(--yellow);
      grid-column: span 2;
    }

    .music-btn:nth-child(5) {
      --accent: var(--red);
      grid-column: span 2;
    }

    .music-btn:nth-child(6) {
      --accent: var(--blue);
      grid-column: span 2;
    }

    .music-btn:nth-child(7) {
      --accent: var(--yellow);
      grid-column: 2 / span 2;
    }

    .music-btn .icon {
      position: relative;
      z-index: 2;
      width: clamp(48px, 5.6vw, 66px);
      height: clamp(48px, 5.6vw, 66px);
      display: block;
      border-radius: 50%;
      border: 3px solid var(--ink);
      background:
        radial-gradient(circle at 50% 50%, var(--accent) 0 22%, var(--cream) 22.8% 26%, var(--ink) 26.8% 36%, transparent 36.8%),
        repeating-radial-gradient(circle at 50% 50%, var(--ink) 0 6px, var(--cream) 7px 9px, var(--ink) 10px 14px);
      box-shadow: 0 0 0 3px var(--accent), 0 0 0 6px var(--ink);
    }

    .music-btn .icon::after {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      border: 2px solid rgba(255, 250, 240, 0.55);
    }

    .music-btn.active {
      z-index: 3;
      box-shadow:
        inset 0 0 0 6px var(--cream),
        inset -8px -8px 0 rgba(7, 11, 15, 0.08),
        0 0 0 5px var(--yellow),
        var(--shadow-hard);
      filter: saturate(1.17);
    }

    .music-btn.active .label {
      background: var(--yellow);
      color: var(--ink);
      box-shadow: 0 4px 0 var(--ink);
    }

    .control-bar {
      width: min(1040px, calc(100vw - 22px));
      min-height: 70px;
      margin: 8px auto 14px;
      padding: 8px 18px;
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) 94px;
      align-items: center;
      gap: 16px;
      border: var(--line);
      border-radius: 18px;
      background:
        radial-gradient(circle, var(--white) 0 3px, transparent 4px) 22px 22px / 22px 22px,
        linear-gradient(180deg, #10151a, var(--ink));
      box-shadow: 0 8px 0 var(--ink), 0 20px 30px rgba(7, 11, 15, 0.28);
    }

    .control-bar::after {
      content: "";
      width: 100%;
      height: 34px;
      border-top: 4px solid var(--yellow);
      border-bottom: 4px solid var(--blue);
      background: repeating-linear-gradient(0deg, transparent 0 10px, var(--yellow) 11px 14px, transparent 15px 22px, var(--blue) 23px 26px);
      justify-self: end;
      opacity: 0.95;
    }

    .play-btn {
      width: 54px;
      height: 54px;
      border: 5px solid var(--white);
      border-radius: 50%;
      color: var(--white);
      background: var(--red);
      font-size: 1.35rem;
      font-weight: 950;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 0 0 5px var(--yellow), 4px 4px 0 var(--ink);
    }

    .play-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 5px var(--yellow), 2px 2px 0 var(--ink);
    }

    .volume {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .volume label {
      color: var(--white);
      font-size: 0.7rem;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    input[type="range"] {
      width: 100%;
      height: 32px;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 16px;
      border: 3px solid var(--white);
      border-radius: 999px;
      background: linear-gradient(90deg, var(--red) 0 72%, var(--cream) 72%);
      box-shadow: inset 0 0 0 3px var(--ink);
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 34px;
      height: 40px;
      margin-top: -12px;
      border: 4px solid var(--ink);
      border-radius: 10px;
      background: repeating-linear-gradient(90deg, transparent 0 8px, var(--ink) 9px 12px, transparent 13px 18px), var(--red);
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
    }

    input[type="range"]::-moz-range-track {
      height: 16px;
      border: 3px solid var(--white);
      border-radius: 999px;
      background: linear-gradient(90deg, var(--red) 0 72%, var(--cream) 72%);
      box-shadow: inset 0 0 0 3px var(--ink);
    }

    input[type="range"]::-moz-range-thumb {
      width: 34px;
      height: 40px;
      border: 4px solid var(--ink);
      border-radius: 10px;
      background: var(--red);
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 840px) {
      .dj-panel {
        grid-template-columns: 1fr;
      }

      .side-rail {
        grid-template-columns: 120px 1fr 92px;
        grid-template-rows: 92px;
        min-height: 0;
        border-right: 0;
        border-bottom: var(--line);
      }

      .dot-matrix,
      .knob-block,
      .side-stripes,
      .wave-block {
        border-bottom: 0;
      }

      .knob-block {
        padding: 16px;
        grid-template-columns: 74px 1fr;
        align-items: center;
      }

      .knob-block::before {
        width: 58px;
        height: 58px;
        box-shadow: 0 0 0 5px var(--cream), 0 0 0 8px var(--ink);
      }

      .fake-fader,
      .side-label,
      .wave-block::after {
        display: none;
      }

      .header {
        align-items: start;
        flex-direction: column;
        gap: 6px;
      }

      .header p {
        max-width: none;
        text-align: left;
      }

      .control-bar {
        grid-template-columns: 64px minmax(0, 1fr);
      }

      .control-bar::after {
        display: none;
      }
    }

    @media (max-width: 620px) {
      .app {
        width: min(100vw - 14px, 540px);
        padding-top: 7px;
      }

      .deck-grid {
        padding: 12px;
      }

      .side-rail {
        display: none;
      }

      .header {
        margin-bottom: 9px;
      }

      .header h1 {
        font-size: clamp(1.85rem, 9vw, 2.65rem);
      }

      .header p {
        font-size: 0.66rem;
      }

      .top-actions {
        grid-template-columns: 1fr;
        gap: 9px;
      }

      .effects-group {
        min-height: 114px;
      }

      .fx-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .music-grid {
        gap: 8px;
      }

      .music-btn,
      .music-btn:nth-child(n) {
        min-height: 92px;
      }

      .music-btn:nth-child(1),
      .music-btn:nth-child(2),
      .music-btn:nth-child(3),
      .music-btn:nth-child(4) {
        grid-column: span 2;
      }

      .music-btn:nth-child(5),
      .music-btn:nth-child(6) {
        grid-column: span 2;
      }

      .music-btn:nth-child(7) {
        grid-column: 2 / span 2;
      }

      .music-btn .icon {
        width: 46px;
        height: 46px;
      }

      .pad .label {
        min-width: 58%;
        min-height: 26px;
        padding: 5px 8px;
        font-size: 0.68rem;
      }

      .fx-btn {
        min-height: 54px;
      }

      .fx-btn .label {
        font-size: 1.08rem;
      }

      .control-bar {
        width: calc(100vw - 14px);
        grid-template-columns: 56px 1fr;
        gap: 10px;
        min-height: 66px;
        padding: 8px 10px;
      }

      .play-btn {
        width: 48px;
        height: 48px;
        font-size: 1.1rem;
        box-shadow: 0 0 0 4px var(--yellow), 3px 3px 0 var(--ink);
      }

      .volume {
        gap: 4px;
      }

      .volume label {
        font-size: 0.68rem;
      }

      input[type="range"]::-webkit-slider-thumb {
        width: 32px;
        height: 38px;
      }
    }

    @media (max-width: 380px) {
      .app,
      .control-bar {
        width: calc(100vw - 10px);
      }

      .deck-grid {
        padding: 10px;
      }

      .fx-btn .label {
        font-size: 0.98rem;
      }

      .music-btn .label {
        padding: 5px 7px;
        font-size: 0.62rem;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="dj-panel" aria-label="Controlador DJ com estilo pop art">
      <aside class="side-rail" aria-hidden="true">
        <div class="dot-matrix"></div>
        <div class="knob-block">
          <div class="fake-fader"></div>
          <span class="side-label">Volume</span>
        </div>
        <div class="side-stripes"></div>
        <div class="wave-block"></div>
      </aside>

      <div class="deck-grid">
        <header class="header">
          <h1>DJ Control</h1>
          <p>Loops automáticos, vinheta sem sobrepor e efeitos independentes</p>
        </header>

        <div class="top-actions">
          <section class="effects-group" aria-label="Efeitos MJ e Shakira">
            <span class="group-title">Efeitos</span>
            <div class="fx-row">
              <button class="pad fx-btn" data-fx="fx1">
                <span class="icon" aria-hidden="true"></span>
                <span class="label">MJ 1</span>
                <span class="sub">Assíncrono</span>
              </button>

              <button class="pad fx-btn" data-fx="fx2">
                <span class="icon" aria-hidden="true"></span>
                <span class="label">MJ 2</span>
                <span class="sub">Assíncrono</span>
              </button>

              <button class="pad fx-btn" data-fx="fx3">
                <span class="icon" aria-hidden="true"></span>
                <span class="label">MJ3</span>
                <span class="sub">Assíncrono</span>
              </button>

              <button class="pad fx-btn" data-fx="sk1">
                <span class="icon" aria-hidden="true"></span>
                <span class="label">SK1</span>
                <span class="sub">Assíncrono</span>
              </button>
              <button class="pad fx-btn" data-fx="plateia">
                <span class="icon" aria-hidden="true"></span>
                <span class="label">Plateia</span>
                <span class="sub">Assíncrono</span>
              </button>
            </div>
          </section>
        </div>

        <div class="music-grid">
          <button class="pad music-btn" data-track="0">
            <span class="icon vinyl" aria-hidden="true"></span>
            <span class="label">MJ Beat It</span>
            <span class="sub">Loop 1 ↔ 2</span>
          </button>

          <button class="pad music-btn" data-track="1">
            <span class="icon vinyl" aria-hidden="true"></span>
            <span class="label">MJ Billie Jean</span>
            <span class="sub">Loop 1 ↔ 2</span>
          </button>

          <button class="pad music-btn" data-track="2">
            <span class="icon vinyl" aria-hidden="true"></span>
            <span class="label">Shakira Waka</span>
            <span class="sub">Loop 3 ↔ 4</span>
          </button>

          <button class="pad music-btn" data-track="3">
            <span class="icon vinyl" aria-hidden="true"></span>
            <span class="label">Shakira Solteira</span>
            <span class="sub">Loop 3 ↔ 4</span>
          </button>

          <button class="pad music-btn" data-track="4">
            <span class="icon vinyl" aria-hidden="true"></span>
            <span class="label">Beyoncé 1</span>
            <span class="sub">Loop 5 ↔ 6</span>
          </button>

          <button class="pad music-btn" data-track="5">
            <span class="icon vinyl" aria-hidden="true"></span>
            <span class="label">Beyoncé 2</span>
            <span class="sub">Loop 5 ↔ 6</span>
          </button>

          <button class="pad music-btn jingle-track" data-track="6">
            <span class="icon horn" aria-hidden="true"><span></span></span>
            <span class="label">Vinheta</span>
            <span class="sub">Sem sobrepor</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="control-bar">
    <button class="play-btn" id="playPauseBtn" aria-label="Reproduzir">▶</button>

    <div class="volume">
      <label for="volumeSlider">Volume</label>
      <input id="volumeSlider" type="range" min="0" max="100" value="75" />
    </div>
  </footer>

  <script>
    const tracks = [
      {
        title: "MJ Beat It",
        src: "Beat_It_MichaelJ.mp3",
        loopGroup: [0, 1]
      },
      {
        title: "MJ Billie Jean",
        src: "Billie_Jean_Michael_Jackson.mp3",
        loopGroup: [0, 1]
      },
      {
        title: "Shakira Waka",
        src: "shakira-waka.mp3",
        loopGroup: [2, 3]
      },
      {
        title: "Shakira Whenever",
        src: "Shakira-Whenever.mp3",
        loopGroup: [2, 3]
      },
      {
        title: "Beyoncé 1",
        src: "Beyonce1.mp3",
        loopGroup: [4, 5]
      },
      {
        title: "Beyoncé 2",
        src: "Beyonce2.mp3",
        loopGroup: [4, 5]
      },
      {
        title: "Vinheta",
        src: "vinheta.mpeg",
        loopGroup: []
      }
    ];

    const oneShotAudios = {
      fx1: "mj-1.mp3",
      fx2: "mj-2.mp3",
      fx3: "mj-3.mp3",
      sk1: "sk-1.mp3",
      plateia: "plateia.mp3",
    };

    const mainAudio = new Audio();
    mainAudio.preload = "auto";

    let currentTrackIndex = null;
    let currentLoopGroup = [];
    let isPlaying = false;
    let masterVolume = 0.75;

    const musicButtons = document.querySelectorAll(".music-btn");
    const fxButtons = document.querySelectorAll(".fx-btn");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const volumeSlider = document.getElementById("volumeSlider");

    const activeOneShots = new Set();

    function updateInterface() {
      musicButtons.forEach((button) => {
        const index = Number(button.dataset.track);
        button.classList.toggle("active", index === currentTrackIndex);
      });

      playPauseBtn.textContent = isPlaying ? "⏸" : "▶";
      playPauseBtn.setAttribute("aria-label", isPlaying ? "Pausar" : "Reproduzir");
    }

    function setVolume(value) {
      masterVolume = value / 100;
      mainAudio.volume = masterVolume;

      activeOneShots.forEach((audio) => {
        audio.volume = masterVolume;
      });
    }

    function playTrack(index, resetTime = true) {
      const track = tracks[index];

      currentTrackIndex = index;
      currentLoopGroup = Array.isArray(track.loopGroup) ? track.loopGroup : [];

      mainAudio.src = track.src;
      mainAudio.volume = masterVolume;

      if (resetTime) {
        mainAudio.currentTime = 0;
      }

      mainAudio.play()
        .then(() => {
          isPlaying = true;
          updateInterface();
        })
        .catch((error) => {
          isPlaying = false;
          updateInterface();
          console.warn("Erro ao tocar a música:", error);
        });
    }

    function playNextInLoop() {
      if (currentTrackIndex === null) {
        isPlaying = false;
        updateInterface();
        return;
      }

      if (currentLoopGroup.length === 0) {
        currentTrackIndex = null;
        currentLoopGroup = [];
        isPlaying = false;
        updateInterface();
        return;
      }

      const currentPosition = currentLoopGroup.indexOf(currentTrackIndex);
      const nextTrackIndex = currentLoopGroup.length === 1
        ? currentLoopGroup[0]
        : currentLoopGroup[(currentPosition + 1) % currentLoopGroup.length];

      playTrack(nextTrackIndex, true);
    }

    function togglePlayPause() {
      if (currentTrackIndex === null) {
        playTrack(0, true);
        return;
      }

      if (mainAudio.paused) {
        if (mainAudio.ended) {
          mainAudio.currentTime = 0;
        }

        mainAudio.play()
          .then(() => {
            isPlaying = true;
            updateInterface();
          })
          .catch((error) => {
            console.warn("Erro ao continuar a música:", error);
          });
      } else {
        mainAudio.pause();
        isPlaying = false;
        updateInterface();
      }
    }

    function playOneShot(src) {
      const audio = new Audio(src);

      audio.volume = masterVolume;
      audio.preload = "auto";

      activeOneShots.add(audio);

      audio.addEventListener("ended", () => {
        activeOneShots.delete(audio);
      });

      audio.addEventListener("error", () => {
        activeOneShots.delete(audio);
        console.warn("Áudio de efeito não encontrado:", src);
      });

      audio.play().catch((error) => {
        activeOneShots.delete(audio);
        console.warn("Erro ao tocar efeito:", error);
      });
    }

    musicButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const index = Number(button.dataset.track);
        playTrack(index, true);
      });
    });

    fxButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const fxName = button.dataset.fx;
        playOneShot(oneShotAudios[fxName]);
      });
    });

    playPauseBtn.addEventListener("click", togglePlayPause);

    volumeSlider.addEventListener("input", (event) => {
      setVolume(Number(event.target.value));
    });

    mainAudio.addEventListener("ended", playNextInLoop);

    setVolume(Number(volumeSlider.value));
    updateInterface();
  </script>
</body>
</html>
